# Alembic configuration for the Data Analysis Platform MVP.
# The database URL is taken from the app config (app.config.DATABASE_URL), so
# one place drives both the runtime and the migrations. Run from `backend/`:
#
#   alembic revision --autogenerate -m "describe change"
#   alembic upgrade head
#
# To run migrations against a specific database override DATABASE_URL in the
# environment, e.g. PowerShell:  $env:DATABASE_URL = "postgresql://..."

[alembic]
script_location = migrations
prepend_sys_path = .
# url is ignored (env.py wires app.config.DATABASE_URL) but kept for tooling.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S