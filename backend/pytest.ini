[pytest]
# The integration journeys live in *_test.py standalone scripts that also run
# under pytest. Kept out of unit-test discovery so `pytest` is quick and clean.
# `assumption_gate_test.py` is the fast engine gate and is included here because
# it runs in a second or so, and because a green `pytest` should mean the
# assumption gate is covered too. `guardrails_test.py` and `result_cache_test.py`
# are the same kind of fast engine gate.
python_files = smoke_test.py statflow_test.py orgs_test.py admin_test.py assumption_gate_test.py result_cache_test.py guardrails_test.py remediation_test.py lineage_test.py frame_cache_test.py textbook_validation_test.py assistant_coverage_test.py
python_functions = test_*
testpaths = tests
addopts = -q